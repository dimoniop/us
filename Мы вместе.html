<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Мы вместе</title>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;600&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6eef3;--card:#fff;--ink:#2b1632;--mute:#7a6683;--line:#e6d6e0;--ac:#b0306a;--acsoft:#f6dbe8;--onac:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1024;--card:#281735;--ink:#f5e9f1;--mute:#b29cbd;--line:#402a50;--ac:#f071a6;--acsoft:#3d2149;--onac:#1c1024}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.5 Onest,system-ui,sans-serif}
main{max-width:680px;margin:0 auto;padding:32px 16px 56px}
h2{font:700 1.25rem/1.3 Playfair Display,Georgia,serif;margin:36px 0 12px}
.hero{text-align:center;padding:24px 0 8px}
.names{font:700 1.25rem Playfair Display,Georgia,serif;color:var(--mute)}
.big{font:900 clamp(4.5rem,24vw,9rem)/1 Playfair Display,Georgia,serif;color:var(--ac);margin:8px 0 0;letter-spacing:-.03em}
.unit{font-size:1.125rem;margin:0}
.parts{color:var(--mute);margin:6px 0 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px}
.t{font-weight:600}.s{color:var(--mute);font-size:.875rem}
.badge{background:var(--acsoft);color:var(--ac);border-radius:99px;padding:3px 12px;font-weight:600;font-size:.875rem;white-space:nowrap}
.bar{height:8px;background:var(--acsoft);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ac);border-radius:99px}
.add{display:grid;grid-template-columns:1fr auto;gap:8px}
.add label.chk{grid-column:1/-1;display:flex;gap:8px;align-items:center;color:var(--mute);font-size:.9375rem}
input[type=text],input[type=date]{min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink);font:inherit}
.btn{padding:12px 18px;border:0;border-radius:10px;background:var(--ac);color:var(--onac);font:inherit;font-weight:600;cursor:pointer}
.link{background:none;border:0;color:var(--mute);font:inherit;font-size:.875rem;cursor:pointer;text-decoration:underline;padding:4px}
.setup{max-width:420px;margin:12vh auto 0;text-align:center}
.setup h1{font:900 2.5rem/1.1 Playfair Display,Georgia,serif;margin:0 0 8px}
.setup form,.setup .f{display:grid;gap:10px;margin-top:20px;text-align:left}
.setup label{font-size:.875rem;color:var(--mute)}
button:focus-visible,input:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.hero{position:relative;padding:56px 0 40px}
.stk{position:absolute;font-size:var(--s,2rem);line-height:1;padding:6px;background:#fff;border-radius:50%;box-shadow:0 0 0 3px #fff,0 3px 8px rgba(120,40,90,.25);transform:rotate(var(--r,0deg));user-select:none;transition:transform .2s}
.stk:hover,.stk:active{transform:rotate(var(--r,0deg)) scale(1.3)}
.ic{font-size:1.5rem;margin-right:12px;background:var(--acsoft);border-radius:12px;width:44px;height:44px;display:grid;place-items:center;flex:none}
.pick{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px}
.pick button{font-size:1.35rem;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.pick button.on{background:var(--acsoft);border-color:var(--ac)}
.foot{text-align:center;font-size:1.75rem;letter-spacing:.3em;margin-top:28px}
</style>
</head>
<body>
<main id="app"></main>
<script>
const KEY="couple-v1";
let S={a:"",b:"",start:"",events:[]};
function load(){try{const v=JSON.parse(localStorage.getItem(KEY));if(v)S=v}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}

// Даты: превращаем "2024-02-14" в дату и считаем разницу в днях
const parse=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>{const t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate())};
const diff=(a,b)=>Math.round((a-b)/864e5);
const addDays=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);return x};
const fmt=d=>d.toLocaleDateString("ru-RU",{day:"numeric",month:"long",year:"numeric"});
const plural=(n,a,b,c)=>{const m=n%100,k=n%10;return(m>10&&m<20)?c:(k===1?a:(k>1&&k<5?b:c))};
const N=(n,a,b,c)=>n+" "+plural(n,a,b,c);

// Годы, месяцы и дни между двумя датами
function ymd(from,to){
  let y=to.getFullYear()-from.getFullYear(),m=to.getMonth()-from.getMonth(),d=to.getDate()-from.getDate();
  if(d<0){m--;d+=new Date(to.getFullYear(),to.getMonth(),0).getDate()}
  if(m<0){y--;m+=12}
  return[y,m,d];
}

// Ближайшая дата события (если повторяется каждый год — берём следующую)
function nextDate(e){
  const d=parse(e.date),t=today();
  if(!e.yearly)return d;
  let n=new Date(t.getFullYear(),d.getMonth(),d.getDate());
  if(n<t)n=new Date(t.getFullYear()+1,d.getMonth(),d.getDate());
  return n;
}
function when(n){
  if(n===0)return"сегодня!";
  return n>0?"через "+N(n,"день","дня","дней"):N(-n,"день","дня","дней")+" назад";
}
const el=(tag,cls,txt)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(txt!==undefined)x.textContent=txt;return x};

function render(){
  const app=document.getElementById("app");app.innerHTML="";
  if(!S.start){setup(app);return}
  const t=today(),start=parse(S.start),days=Math.max(0,diff(t,start));
  const[y,m,d]=ymd(start,t);

  // Главный экран: счётчик дней
  const hero=el("section","hero");
  hero.append(el("div","names",[S.a,S.b].filter(Boolean).join(" ♥ ")||"Мы вместе"),
    el("div","big",days),el("p","unit",plural(days,"день","дня","дней")+" вместе"),
    el("p","parts",[y&&N(y,"год","года","лет"),m&&N(m,"месяц","месяца","месяцев"),N(d,"день","дня","дней")].filter(Boolean).join(", ")+" · с "+fmt(start)));
  // Стикеры: [эмодзи, left %, top %, поворот, размер в rem]
  [["🧸",2,2,-14,2.4],["💗",84,0,12,2],["🎀",24,-2,-8,1.7],["🌸",-1,44,-10,1.9],["🐰",87,44,10,2.3],["🍓",6,90,12,1.9],["🦋",80,92,-12,2],["⭐",46,96,8,1.6]].forEach(([c,x,y,r,s])=>{const k=el("span","stk",c);k.setAttribute("aria-hidden","true");k.style.cssText="left:"+x+"%;top:"+y+"%;--r:"+r+"deg;--s:"+s+"rem";hero.append(k)});
  app.append(hero);

  // Следующая круглая дата
  const marks=[100,200,300,365,500,730,1000,1500,2000,3000,3650,5000];
  const next=marks.find(k=>k>days),prev=[0,...marks].filter(k=>k<=days).pop();
  if(next){
    const c=el("div","card"),r=el("div","row");
    r.append(el("div","",""),el("span","badge",when(next-days)));
    r.firstChild.append(el("div","t","🎁 Следующая отметка: "+N(next,"день","дня","дней")+" вместе"),el("div","s",fmt(addDays(start,next))));
    const bar=el("div","bar"),i=el("i");i.style.width=Math.round((days-prev)/(next-prev)*100)+"%";bar.append(i);
    c.append(r,bar);app.append(c);
  }

  // Важные даты
  app.append(el("h2","","💌 Важные даты"));
  const list=S.events.map((e,i)=>({e,i,n:diff(nextDate(e),t)})).sort((a,b)=>(a.n<0)-(b.n<0)||(a.n<0?b.n-a.n:a.n-b.n));
  if(!list.length)app.append(el("p","s","Добавьте первое важное событие: годовщину, день рождения, поездку."));
  list.forEach(({e,i,n})=>{
    const c=el("div","card"),r=el("div","row"),l=el("div"),ic=el("div","ic",e.ic||"💖");
    l.append(el("div","t",e.title),el("div","s",fmt(nextDate(e))+(e.yearly?" · каждый год":"")));
    const lw=el("div");lw.style.cssText="display:flex;align-items:center;min-width:0";lw.append(ic,l);
    const right=el("div");right.style.textAlign="right";
    right.append(el("span","badge",when(n)));
    const del=el("button","link","удалить");del.onclick=()=>{S.events.splice(i,1);save();render()};
    right.append(document.createElement("br"),del);
    r.append(lw,right);c.append(r);app.append(c);
  });

  const f=el("div","card add");
  const title=el("input");title.type="text";title.placeholder="Название, например «Первое свидание»";title.maxLength=50;
  const date=el("input");date.type="date";
  const lab=el("label","chk"),chk=el("input");chk.type="checkbox";chk.checked=true;lab.append(chk,"Повторять каждый год");
  const b=el("button","btn","Добавить");
  b.onclick=()=>{if(!title.value.trim()||!date.value)return;S.events.push({title:title.value.trim(),date:date.value,yearly:chk.checked,ic:pic});save();render()};
  let pic="💖";const pk=el("div","pick");
  ["💖","🎂","💍","✈️","🌹","🍷","🏠","🎁","🐾","🎬","🎄","📸"].forEach(x=>{const q=el("button",x===pic?"on":"",x);q.type="button";q.setAttribute("aria-label","Стикер "+x);q.onclick=()=>{pic=x;[...pk.children].forEach(n=>n.classList.toggle("on",n===q))};pk.append(q)});
  f.append(title,date,pk,lab,b);b.style.gridColumn="1/-1";app.append(f);

  app.append(el("div","foot","🧸💕🌸🐰🍓🦋"));
  const edit=el("button","link","Изменить имена и дату начала");edit.onclick=()=>{S.start="";render()};
  const w=el("div");w.style.textAlign="center";w.style.marginTop="24px";w.append(edit);app.append(w);
}

// Первый экран: имена и дата начала отношений
function setup(app){
  const box=el("section","setup");
  box.append(el("div","foot","🧸💗🐰"),el("h1","","Сколько мы вместе?"),el("p","s","Введите дату начала отношений, и мы начнём считать."));
  const f=el("div","f");
  const a=el("input");a.type="text";a.placeholder="Ваше имя";a.value=S.a||"";
  const b=el("input");b.type="text";b.placeholder="Имя партнёра";b.value=S.b||"";
  const lab=el("label","","Дата начала отношений");
  const d=el("input");d.type="date";d.value=S.start||"";d.max=iso(today());
  const go=el("button","btn","Начать считать");
  go.onclick=()=>{if(!d.value)return;S.a=a.value.trim();S.b=b.value.trim();S.start=d.value;save();render()};
  f.append(a,b,lab,d,go);box.append(f);app.append(box);
}
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");

load();render();
</script>
</body>
</html>
